<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI 코딩 에이전트를 팀처럼 운용해 아이디어를 배포까지 끌고 가는 이승준의 포트폴리오. 앱, 게임, 데이터 도구, 아카이브 작업을 모았습니다." />
    <meta property="og:title" content="이승준 · Product Builder" />
    <meta property="og:description" content="문제를 정하고, 명세로 맡기고, 검증해서 배포합니다." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>이승준 · Product Builder</title>
  </head>
  <body>
    <script>
      // Apply the saved color mode before first paint to avoid a theme flash.
      try {
        var mode = localStorage.getItem('junlee-color-mode')
        if (mode === 'light-only' || mode === 'dark-only') document.documentElement.dataset.seedColorMode = mode
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
