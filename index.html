<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="제품의 질문을 분명한 상태와 따뜻한 인터랙션으로 구현하는 이준의 프런트엔드 포트폴리오. SEED Design으로 만들었습니다." />
    <meta property="og:title" content="이준 · Product Frontend Engineer" />

    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>이준 · Product Frontend Engineer</title>
  </head>
  <body>
    <script>
      // Apply the saved color mode before first paint to avoid a theme flash.
      try {
        var mode = localStorage.getItem('junlee-color-mode')
        if (mode === 'light-only' || mode === 'dark-only') document.documentElement.dataset.seedColorMode = mode
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
